<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ultimate Bash Guys Supreme</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="ui">
    <div id="start-screen">
      <h1>Character Select</h1>
      <p>Pick a fighter (placeholder for now). Click Start to enter the stage.</p>

      <div id="char-select">
        <label class="char-card">
          <input type="radio" name="character" value="placeholder" checked>
          <div class="char-art">P</div>
          <div class="char-name">placeholder</div>
        </label>
        <!-- you can add more character cards later -->
      </div>

      <button id="start-btn">Start Game</button>
    </div>

    <div id="hud" class="hidden">
      <div id="character-label">Character: <span id="selected-character-name">placeholder</span></div>
      <div id="message"></div>
      <div id="controls">Click anywhere to punch (normal attack)</div>
    </div>
  </div>

  <div id="container"></div>

  <script src="https://unpkg.com/three@0.154.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.154.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
